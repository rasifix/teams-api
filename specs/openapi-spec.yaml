  /api/squads/{squadId}/activities/{id}/teams/{teamId}/shirts:
    put:
      operationId: setActivityTeamShirts
      tags: [Activities]
      security: [{ bearerAuth: [] }]
      parameters: *activityTeamCommandParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityShirtsCommand' }
      responses: *activityCommandResponses
  /api/squads/{squadId}/activities/{id}/teams/{teamId}/lineup:
