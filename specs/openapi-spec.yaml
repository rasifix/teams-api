        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  message:
                    type: string
                    example: "Teams API is running"
                  database:
                    type: object
                    required: [status, database, collections]
                    properties:
                      status:
                        type: string
                        enum: [healthy]
                      database:
                        type: string
                      collections:
                        type: integer
                  activityEventSourcing:
                    type: object
                    required: [enabled, metrics]
                    properties:
                      enabled: { type: boolean }
                      metrics:
                        $ref: '#/components/schemas/ActivityEventSourcingMetrics'
        '503':
          description: Service unavailable - database unhealthy
          content:
            application/json:
              schema:
                type: object
                required: [status, message, error]
                properties:
                  status: { type: string, enum: [error] }
                  message: { type: string }
                  error: { type: string }
