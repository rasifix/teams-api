        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivitySelectionChangesCommand' }
      responses: *activityCommandResponses
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/login or /auth/register
  parameters:
    ActivitySquadId: { name: squadId, in: path, required: true, schema: { type: string } }
    ActivityPathId: { name: id, in: path, required: true, schema: { type: string } }
    ActivityTeamId: { name: teamId, in: path, required: true, schema: { type: string } }
    ActivityIfMatch:
      name: If-Match
      in: header
      required: false
      description: Expected Activity event revision, returned as the ETag from a previous read.
      schema:
        type: string
        pattern: '^"activity-revision-[0-9]+"$'
    ActivityIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated key for safely retrying the same Activity command.
      schema:
        type: string
        minLength: 1
  headers:
    ActivityETag:
      description: Current Activity event revision.
      schema:
        type: string
        pattern: '^"activity-revision-[0-9]+"$'
  schemas:
    BirthdayCalendarSubscription:
      type: object
      required: [subscriptionUrl]
      properties:
        subscriptionUrl: { type: string, format: uri }
    ActivityEventSourcingMetrics:
      type: object
      required: [commandsAppended, commandConflicts, projectionRepairs, replayFailures, reconciliationFailures]
      properties:
        commandsAppended: { type: integer, minimum: 0 }
        commandConflicts: { type: integer, minimum: 0 }
        projectionRepairs: { type: integer, minimum: 0 }
        replayFailures: { type: integer, minimum: 0 }
        reconciliationFailures: { type: integer, minimum: 0 }
    ActivityEventMigrationResult:
      type: object
      required: [scanned, imported, alreadyMigrated, skipped, verified, mismatches]
      properties:
        scanned: { type: integer, minimum: 0 }
        imported: { type: integer, minimum: 0 }
        alreadyMigrated: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        verified: { type: integer, minimum: 0 }
        mismatches:
          type: array
          items:
            type: object
            required: [squadId, activityId, revision, reason, differences]
            properties:
              squadId: { type: string }
              activityId: { type: string }
              revision: { type: integer }
              reason: { type: string }
              differences:
                type: array
                items:
                  type: object
                  required: [path]
                  properties:
                    path: { type: string }
                    expected: {}
                    actual: {}
    ActivityHistoryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ActivityHistoryItem' }
    ActivityHistoryItem:
      type: object
      required: [id, revision, recordedAt, actor, changes]
      properties:
        id: { type: string }
        revision: { type: integer }
        recordedAt: { type: string, format: date-time }
        actor: { $ref: '#/components/schemas/ActivityHistoryActor' }
        changes:
          type: array
          items: { $ref: '#/components/schemas/ActivityHistoryChange' }
    ActivityHistoryActor:
      type: object
      required: [type, memberId, displayName]
      properties:
        type: { type: string, enum: [user, system] }
        memberId: { type: string, nullable: true }
        displayName: { type: string, nullable: true }
    ActivityHistorySubject:
      type: object
      required: [type, id, displayName]
      properties:
        type: { type: string, enum: [activity, team, player, person] }
        id: { type: string }
        displayName: { type: string, nullable: true }
    ActivityHistoryChange:
      oneOf:
        - { $ref: '#/components/schemas/ActivityHistoryFieldChange' }
        - { $ref: '#/components/schemas/ActivityHistorySelectionChange' }
        - { $ref: '#/components/schemas/ActivityHistoryLineupChange' }
        - { $ref: '#/components/schemas/ActivityHistoryUnsupportedChange' }
        - { $ref: '#/components/schemas/ActivityHistorySimpleChange' }
    ActivityHistoryFieldChange:
      type: object
      required: [type, subject, field, previous, current]
      properties:
        type: { type: string, enum: [activity.detailsChanged, team.detailsChanged, invitation.responseChanged, attendance.changed] }
        subject: { $ref: '#/components/schemas/ActivityHistorySubject' }
        field: { type: string }
        previous: { nullable: true }
        current: { nullable: true }
    ActivityHistorySimpleChange:
      type: object
      required: [type, subject]
      properties:
        type: { type: string, enum: [activity.created, activity.imported, activity.deleted, team.added, team.removed, invitation.added, invitation.removed, selection.markedSent, attendance.removed] }
        subject: { $ref: '#/components/schemas/ActivityHistorySubject' }
        previous: { nullable: true }
        current: { nullable: true }
    ActivityHistorySelectionChange:
      type: object
      required: [type, subject, context]
      properties:
        type: { type: string, enum: [selection.playerAdded, selection.playerRemoved] }
        subject: { $ref: '#/components/schemas/ActivityHistorySubject' }
        context: { $ref: '#/components/schemas/ActivitySelectionHistoryContext' }
    ActivityHistoryLineupChange:
      type: object
      required: [type, subject, context]
      properties:
        type: { type: string, enum: [lineup.changed] }
        subject: { $ref: '#/components/schemas/ActivityHistorySubject' }
        context: { $ref: '#/components/schemas/ActivityLineupHistoryContext' }
    ActivityHistoryUnsupportedChange:
      type: object
      required: [type, subject, context]
      properties:
        type: { type: string, enum: [event.unsupported] }
        subject: { $ref: '#/components/schemas/ActivityHistorySubject' }
        context: { $ref: '#/components/schemas/ActivityUnsupportedHistoryContext' }
    ActivitySelectionHistoryContext:
      type: object
      required: [teamId, teamName]
      properties:
        teamId: { type: string }
        teamName: { type: string, nullable: true }
        reason: { type: string }
        removedAt: { type: string, format: date-time }
    ActivityLineupHistoryContext:
      type: object
      required: [periods, assignmentChanges]
      properties:
        periods: { type: array, items: { type: integer } }
        assignmentChanges: { type: integer }
    ActivityUnsupportedHistoryContext:
      type: object
      required: [eventType, schemaVersion]
      properties:
        eventType: { type: string }
        schemaVersion: { type: integer }
    ActivityDetailsPatch:
      type: object
      description: >-
        Switching a Match to a Tournament clears its opponent, match format,
        and all team lineups in the same Activity commit. A Tournament can
        become a Match only when it has exactly one team. Spond-linked
        Activities may change kind locally while schedule fields stay managed
        by Spond.
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/ActivityKind' }
        name: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, nullable: true }
        location: { type: string, nullable: true }
        opponentName: { type: string, nullable: true }
        matchFormatId: { type: string, nullable: true }
        minPlayersPerTeam: { type: integer, minimum: 1 }
        maxPlayersPerTeam: { type: integer, minimum: 1 }
    AddActivityTeam:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        strength: { type: integer, minimum: 1, maximum: 3 }
        startTime: { type: string, pattern: '^\\d{2}:\\d{2}$' }
    ActivityTeamDetailsPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        strength: { type: integer, minimum: 1, maximum: 3 }
        startTime: { type: string, nullable: true }
        location: { type: string, nullable: true }
        meetingTime: { type: string, nullable: true }
        meetingLocation: { type: string, nullable: true }
    ActivityResponsiblePersonCommand:
      type: object
      additionalProperties: false
      required: [responsiblePersonId]
      properties:
        responsiblePersonId: { type: string, nullable: true }
    ActivityFormationCommand:
      type: object
      additionalProperties: false
      required: [formationId]
      properties:
        formationId: { type: string, nullable: true }
    ActivityShirtsCommand:
      type: object
      additionalProperties: false
      required: [shirtSetId, assignments]
      properties:
        shirtSetId: { type: string }
        assignments:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [playerId, shirtNumber]
            properties:
              playerId: { type: string }
              shirtNumber: { type: integer }
    ActivityLineupCommand:
      type: object
      additionalProperties: false
      required: [periods]
      properties:
        periods:
          type: array
          items: { $ref: '#/components/schemas/TeamLineupPeriod' }
    ActivitySelectionChangesCommand:
      type: object
      additionalProperties: false
      required: [add, remove]
      properties:
        add: { type: array, items: { type: string } }
        remove:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [playerId]
            properties:
              playerId: { type: string }
              reason: { type: string }
    AddActivityInvitationsCommand:
      type: object
      additionalProperties: false
      required: [players]
      properties:
        players:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [playerId, response]
            properties:
              playerId: { type: string }
              response: { type: string, enum: [open, accepted, declined] }
    ActivityAttendanceChangesCommand:
      type: object
      additionalProperties: false
      required: [changes]
      properties:
        changes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [personId, status]
            properties:
              personId: { type: string }
              status: { type: string, enum: [present, absent, excused], nullable: true }
              reason: { type: string, minLength: 1 }
    SpondCredentials:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      required: [email, password]
    SpondSnapshotRequest:
      allOf:
        - $ref: '#/components/schemas/SpondCredentials'
        - type: object
          additionalProperties: false
          properties:
            groupId:
              type: string
            subGroupId:
              type: string
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
          required: [groupId, from, to]
    SpondSubGroupSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        color:
          type: string
      required: [id, name]
    SpondGroupSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        subGroups:
          type: array
          items:
            $ref: '#/components/schemas/SpondSubGroupSummary'
      required: [id, name]
    SpondGuardianSnapshot:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
      required: [id, firstName, lastName]
    SpondMemberSnapshot:
      type: object
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date
        guardians:
          type: array
          items:
            $ref: '#/components/schemas/SpondGuardianSnapshot'
        roles:
          type: array
          items:
            type: string
        subGroups:
          type: array
          items:
            type: string
      required: [id, firstName, lastName, guardians, roles]
    SpondEventResponse:
      type: object
      properties:
        spondMemberId:
          type: string
        response:
          type: string
          enum: [open, accepted, declined]
      required: [spondMemberId, response]
    SpondEventSnapshot:
      type: object
      properties:
        id:
          type: string
        groupId:
          type: string
        type:
          type: string
        matchEvent:
          type: boolean
        status:
          type: string
          enum: [active, cancelled, deleted]
        name:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        location:
          type: string
        responses:
          type: array
          items:
            $ref: '#/components/schemas/SpondEventResponse'
      required: [id, groupId, type, status, name, startsAt, responses]
    SpondSnapshot:
      type: object
      properties:
        group:
          allOf:
            - $ref: '#/components/schemas/SpondGroupSummary'
            - type: object
              properties:
                members:
                  type: array
                  items:
                    $ref: '#/components/schemas/SpondMemberSnapshot'
              required: [members]
        activities:
          type: array
          items:
            $ref: '#/components/schemas/SpondEventSnapshot'
        sourceReadAt:
          type: string
          format: date-time
      required: [group, activities, sourceReadAt]
    SpondMemberDecision:
      oneOf:
        - type: object
          properties:
            action: { type: string, enum: [link] }
            spondMemberId: { type: string }
            memberId: { type: string }
          required: [action, spondMemberId, memberId]
        - type: object
          properties:
            action: { type: string, enum: [create-player] }
            spondMemberId: { type: string }
            birthDate: { type: string, format: date }
            level: { type: integer, minimum: 1, maximum: 5 }
            status: { type: string, enum: [active, trial, inactive] }
            guardianIds:
              type: array
              items: { type: string }
          required: [action, spondMemberId, birthDate, level, status, guardianIds]
        - type: object
          properties:
            action: { type: string, enum: [skip] }
            spondMemberId: { type: string }
          required: [action, spondMemberId]
    SpondActivityDecision:
      oneOf:
        - type: object
          properties:
            action: { type: string, enum: [link] }
            spondEventId: { type: string }
            activityId: { type: string }
          required: [action, spondEventId, activityId]
        - type: object
          properties:
            action: { type: string, enum: [create] }
            spondEventId: { type: string }
            kind:
              $ref: '#/components/schemas/ActivityKind'
            trainerIds:
              type: array
              items: { type: string }
            teams:
              type: array
              items:
                $ref: '#/components/schemas/SpondImportTeam'
          required: [action, spondEventId, kind]
        - type: object
          properties:
            action: { type: string, enum: [skip] }
            spondEventId: { type: string }
          required: [action, spondEventId]
    SpondImportTeam:
      type: object
      properties:
        name: { type: string }
        strength: { type: integer, minimum: 1, maximum: 3 }
        selectedPlayers:
          type: array
          items: { type: string }
      required: [name, strength, selectedPlayers]
    SpondImportRequest:
      type: object
      properties:
        importId: { type: string, format: uuid }
        spondGroupId: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        squadUpdatedAt: { type: string, format: date-time }
        snapshot:
          $ref: '#/components/schemas/SpondSnapshot'
        members:
          type: array
          items:
            $ref: '#/components/schemas/SpondMemberDecision'
        activities:
          type: array
          items:
            $ref: '#/components/schemas/SpondActivityDecision'
      required: [importId, spondGroupId, from, to, snapshot, members, activities]
    SpondImportResult:
      type: object
      properties:
        importId: { type: string, format: uuid }
        created: { type: integer, minimum: 0 }
        linked: { type: integer, minimum: 0 }
        updated: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        warnings:
          type: array
          items: { type: string }
      required: [importId, created, linked, updated, unchanged, skipped, warnings]
    ActivityEventType:
      type: string
      enum:
        - ActivityCreated
        - ActivityImported
        - ActivityDetailsChanged
        - ActivityDeleted
        - InvitationAdded
        - InvitationRemoved
        - InvitationResponseChanged
        - TeamAdded
        - TeamChanged
        - TeamRemoved
        - PlayerSelected
        - PlayerUnselected
        - LineupChanged
        - SelectionPublished
        - AttendanceRecorded
        - AttendanceRemoved
        - TaskCreated
        - TaskChanged
        - TaskDeleted
        - TaskSignupAdded
        - TaskSignupRemoved
        - TrainingPlanChanged
    ActivityAuditEvent:
      type: object
      properties:
        _id: { type: string }
        streamId: { type: string }
        aggregateType: { type: string, enum: [activity] }
        aggregateId: { type: string }
        squadId: { type: string }
        revision: { type: integer, minimum: 1 }
        command:
          type: object
          additionalProperties: true
        actor:
          type: object
          additionalProperties: true
        recordedAt: { type: string, format: date-time }
        correlationId: { type: string }
        events:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [_id, streamId, aggregateType, aggregateId, squadId, revision, command, actor, recordedAt, correlationId, events]
    ActivityAuditEventPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActivityAuditEvent'
        nextCursor:
          type: string
      required: [items]
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
    UserResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - email
    Squad:
      type: object
      properties:
        id:
          type: string
        active:
          type: boolean
          default: true
          description: Soft lifecycle state. Inactive groups remain persisted but are omitted from API reads.
        name:
          type: string
        club:
          type: string
          nullable: true
        category:
          $ref: '#/components/schemas/GroupCategory'
        description:
          type: string
          nullable: true
        trainers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              email:
                type: string
                format: email
        members:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/Player'
              - $ref: '#/components/schemas/Trainer'
        periods:
          type: array
          items:
            $ref: '#/components/schemas/Period'
        matchPlanningEnabled:
          type: boolean
          default: false
          description: Opt-in flag for Playing Modes/Formations/lineup planning.
        playingModes:
          type: array
          items:
            $ref: '#/components/schemas/PlayingMode'
          description: Squad-scoped only; never shared with other groups.
        matchFormats:
          type: array
          items:
            $ref: '#/components/schemas/PlayingMode'
          description: >-
            Squad alias of playingModes; returned on /api/squads routes with
            the same values. Stored as playingModes.
        formations:
          type: array
          items:
            $ref: '#/components/schemas/Formation'
          description: Squad-scoped only; never shared with other groups.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
    SfvCategoryCatalog:
      type: object
      properties:
        version:
          type: string
          example: '2026-10-09'
        source:
          type: string
          example: User-provided SFV category-format data
        categories:
          type: object
          additionalProperties:
            type: object
            properties:
              activityType:
                type: string
                enum: [match, tournament]
              minPlayersPerTeam:
                type: integer
                minimum: 1
              maxPlayersPerTeam:
                type: integer
                minimum: 1
              matchFormat:
                $ref: '#/components/schemas/MatchFormatDefinition'
            required: [activityType]
      required: [version, source, categories]
    MatchFormatDefinition:
      type: object
      properties:
        name:
          type: string
        numberOfPeriods:
          type: integer
          minimum: 1
        periodLengthMinutes:
          type: integer
          minimum: 1
        minimumPeriodsPerPlayer:
          type: integer
          minimum: 0
        playersOnField:
          type: integer
          minimum: 1
        minPlayersPerTeam:
          type: integer
          minimum: 1
        maxPlayersPerTeam:
          type: integer
          minimum: 1
      required: [name, numberOfPeriods, periodLengthMinutes, minimumPeriodsPerPlayer]
    Period:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
      required:
        - id
        - name
        - startDate
        - endDate
    CreateGroupRequest:
      type: object
      properties:
        name:
          type: string
        club:
          type: string
          nullable: true
        category:
          $ref: '#/components/schemas/GroupCategory'
        description:
          type: string
          nullable: true
        trainers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              email:
                type: string
                format: email
      required:
        - name
    UpdateGroupRequest:
      type: object
      properties:
        active:
          type: boolean
          description: Set to false to deactivate the group without deleting its data. Requires the admin role.
        name:
          type: string
        club:
          type: string
          nullable: true
        category:
          $ref: '#/components/schemas/GroupCategory'
        description:
          type: string
          nullable: true
        trainers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              email:
                type: string
                format: email
        matchPlanningEnabled:
          type: boolean
          description: >-
            Toggling this does not delete existing Playing Modes, Formations,
            or Team lineup data. Requires admin or trainer role.
    GroupCategory:
      type: string
      enum: [A, B, C, D9, D7, E, F, G, FF7, FF9, FF11, FF14, FF17]
      description: Swiss Football Association (SFV) team category.
    CreatePeriodRequest:
      type: object
      properties:
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
      required:
        - name
        - startDate
        - endDate
    UpdatePeriodRequest:
      type: object
      properties:
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
    PlayingMode:
      type: object
      description: >-
        Squad-scoped subresource (see Squad.playingModes). Never referenced
        across groups.
      properties:
        id:
          type: string
        name:
          type: string
          example: "4x20"
        numberOfPeriods:
          type: integer
          minimum: 1
          example: 4
        periodLengthMinutes:
          type: integer
          minimum: 1
          example: 20
        minimumPeriodsPerPlayer:
          type: integer
          minimum: 0
          example: 2
          default: 0
          description: >-
            Minimum number of distinct periods in which every selected player
            should have a field assignment. Must not exceed numberOfPeriods.
            Zero disables the minimum-playing-time rule. Violations are
            advisory and do not prevent saving a team lineup.
        isDefault:
          type: boolean
          default: false
          description: Exactly one Playing Mode per group may be true.
        playersOnField:
          type: integer
          minimum: 1
        minPlayersPerTeam:
          type: integer
          minimum: 1
        maxPlayersPerTeam:
          type: integer
          minimum: 1
        origin:
          type: string
      required:
        - id
        - name
        - numberOfPeriods
        - periodLengthMinutes
        - minimumPeriodsPerPlayer
    CreatePlayingModeRequest:
      type: object
      properties:
        name:
          type: string
        numberOfPeriods:
          type: integer
          minimum: 1
        periodLengthMinutes:
          type: integer
          minimum: 1
        minimumPeriodsPerPlayer:
          type: integer
          minimum: 0
          default: 0
          description: >-
            Must not exceed numberOfPeriods. Zero disables the rule.
        playersOnField:
          type: integer
          minimum: 1
        minPlayersPerTeam:
          type: integer
          minimum: 1
        maxPlayersPerTeam:
          type: integer
          minimum: 1
        origin:
          type: string
      required:
        - name
        - numberOfPeriods
        - periodLengthMinutes
        - minimumPeriodsPerPlayer
    UpdatePlayingModeRequest:
      type: object
      properties:
        name:
          type: string
        numberOfPeriods:
          type: integer
          minimum: 1
        periodLengthMinutes:
          type: integer
          minimum: 1
        minimumPeriodsPerPlayer:
          type: integer
          minimum: 0
          description: >-
            Must not exceed the resulting numberOfPeriods. Zero disables the
            rule.
        playersOnField:
          type: integer
          minimum: 1
        minPlayersPerTeam:
          type: integer
          minimum: 1
        maxPlayersPerTeam:
          type: integer
          minimum: 1
        origin:
          type: string
    PositionCode:
      type: string
      description: >-
        Language-neutral position abbreviation (same catalog as used in
        games like FIFA). Translating a code into a localized label (e.g.
        English "LB" for "left back" vs. German "LV" for "linker
        Verteidiger") is a frontend i18n concern; the backend only stores
        and validates the code.
      enum:
        - GK
        - LB
        - CB
        - RB
        - LWB
        - RWB
        - CDM
        - CM
        - CAM
        - LM
        - RM
        - LW
        - RW
        - CF
        - ST
    FormationSlot:
      type: object
      properties:
        id:
          type: string
        positionCode:
          $ref: '#/components/schemas/PositionCode'
      required:
        - id
        - positionCode
    Formation:
      type: object
      description: >-
        Squad-scoped subresource (see Squad.formations). Never referenced
        across groups.
      properties:
        id:
          type: string
        name:
          type: string
          example: "3-3"
        slots:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/FormationSlot'
          description: >-
            Exactly one slot must have positionCode GK; other codes may
            repeat (e.g. two CB slots), distinguished only by array order.
      required:
        - id
        - name
        - slots
    CreateFormationRequest:
      type: object
      properties:
        name:
          type: string
        slots:
          type: array
          minItems: 2
          items:
            type: object
            properties:
              positionCode:
                $ref: '#/components/schemas/PositionCode'
            required:
              - positionCode
      required:
        - name
        - slots
    UpdateFormationRequest:
      type: object
      properties:
        name:
          type: string
        slots:
          type: array
          minItems: 2
          items:
            type: object
            properties:
              id:
                type: string
              positionCode:
                $ref: '#/components/schemas/PositionCode'
            required:
              - positionCode
    LineupPositionAssignment:
      type: object
      properties:
        slotId:
          type: string
          description: Must reference a slot in the Team's selected Formation.
        playerId:
          type: string
          description: Must be one of the Team's selectedPlayers.
      required:
        - slotId
        - playerId
    TeamLineupPeriod:
      type: object
      properties:
        periodNumber:
          type: integer
          minimum: 1
          description: Must not exceed the Event's Playing Mode numberOfPeriods.
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/LineupPositionAssignment'
          description: >-
            Selected players absent here are implicitly benched for this
            period; no explicit bench list is stored.
      required:
        - periodNumber
        - assignments
    Player:
      type: object
      properties:
        id:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/GroupRole'
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date
          description: Canonical player birth date; birthYear is derived from this value.
        birthYear:
          type: integer
          readOnly: true
          deprecated: true
          description: Derived from birthDate. Use birthDate for writes.
        level:
          type: integer
          minimum: 1
          maximum: 5
        preferredShirtNumber:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [active, trial, inactive]
          default: active
        guardians:
          type: array
          items:
            $ref: '#/components/schemas/Guardian'
      required:
        - id
        - roles
        - firstName
        - lastName
        - level
    PlayerEvaluation:
      type: object
      properties:
        id:
          type: string
        playerId:
          type: string
        evaluationDate:
          type: string
          format: date
        userId:
          type: string
        score:
          type: object
          properties:
            technical:
              type: integer
              minimum: 1
              maximum: 5
            intelligence:
              type: integer
              minimum: 1
              maximum: 5
            personality:
              type: integer
              minimum: 1
              maximum: 5
            speed:
              type: integer
              minimum: 1
              maximum: 5
        comments:
          type: string
          nullable: true
      required:
        - playerId
        - evaluationDate
        - score
        - userId
    Trainer:
      type: object
      properties:
        id:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/GroupRole'
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
          nullable: true
      required:
        - id
        - roles
        - firstName
        - lastName
    Guardian:
      type: object
      properties:
        id:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/GroupRole'
        groupId:
          type: string
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
      required:
        - id
        - groupId
        - roles
    GroupRole:
      type: string
      enum: [admin, trainer, guardian, player]
    CreateGuardianRequest:
      type: object
      properties:
        guardianId:
          type: string
      required:
        - guardianId
    PlayerWithRole:
      allOf:
        - $ref: '#/components/schemas/Player'
    TrainerWithRole:
      allOf:
        - $ref: '#/components/schemas/Trainer'
    CreatePlayerRequest:
      type: object
      properties:
        role:
          type: string
          enum: [player]
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date
          description: Canonical date of birth. Do not send the derived birthYear field.
        level:
          type: integer
          minimum: 1
          maximum: 5
        preferredShirtNumber:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [active, trial, inactive]
          default: active
      required:
        - role
        - firstName
        - lastName
        - birthDate
        - level
    CreateTrainerRequest:
      type: object
      properties:
        role:
          type: string
          enum: [trainer]
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
      required:
        - role
        - firstName
        - lastName
    UpdatePlayerRequest:
      type: object
      properties:
        role:
          type: string
          enum: [player]
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date
          description: Canonical date of birth. Do not send the derived birthYear field.
        level:
          type: integer
          minimum: 1
          maximum: 5
        preferredShirtNumber:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [active, trial, inactive]
          default: active
      required:
        - role
        - firstName
        - lastName
        - birthDate
        - level
    UpdateTrainerRequest:
      type: object
      properties:
        role:
          type: string
          enum: [trainer]
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
      required:
        - role
        - firstName
        - lastName
    Invitation:
      type: object
      properties:
        id:
          type: string
          
        playerId:
          type: string
          
        status:
          type: string
          enum: [open, accepted, declined, injured, sick, unavailable]
      required:
        - id
        - playerId
        - status
    ActivityKind:
      type: string
      enum: [match, tournament]
    ActivityStatus:
      type: string
      enum: [active, cancelled]
    AttendanceStatus:
      type: string
      enum: [present, absent, excused]
    ActivityAttendance:
      type: object
      properties:
        personId:
          type: string
        status:
          $ref: '#/components/schemas/AttendanceStatus'
        reason:
          type: string
      required: [personId, status]
    ActivityInvitation:
      type: object
      properties:
        id:
          type: string
        playerId:
          type: string
        response:
          type: string
          enum: [open, accepted, declined]
        declineReason:
          type: string
          enum: [injured, sick, unavailable]
        respondedBy:
          type: string
      required: [id, playerId, response]
    ActivityInvitationUpdate:
      type: object
      properties:
        playerId:
          type: string
        response:
          type: string
          enum: [open, accepted, declined]
        declineReason:
          type: string
          enum: [injured, sick, unavailable]
      required: [response]
    Activity:
      type: object
      properties:
        id:
          type: string
        spondId:
          type: string
          nullable: true
        squadId:
          type: string
        kind:
          $ref: '#/components/schemas/ActivityKind'
        status:
          $ref: '#/components/schemas/ActivityStatus'
        name:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          nullable: true
        location:
          type: string
        matchFormatId:
          type: string
          nullable: true
        opponentName:
          type: string
        minPlayersPerTeam:
          type: integer
          minimum: 1
        maxPlayersPerTeam:
          type: integer
          minimum: 1
        teams:
          type: array
          items:
            $ref: '#/components/schemas/Team'
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/ActivityInvitation'
        selectionSentAt:
          type: string
          format: date-time
        attendance:
          type: array
          items:
            $ref: '#/components/schemas/ActivityAttendance'
      required: [id, squadId, kind, status, name, startsAt, teams, invitations]
    CreateActivityRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/ActivityKind'
        name:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          nullable: true
        location:
          type: string
        matchFormatId:
          type: string
          nullable: true
        opponentName:
          type: string
        minPlayersPerTeam:
          type: integer
          minimum: 1
        maxPlayersPerTeam:
          type: integer
          minimum: 1
        teams:
          type: array
          items:
            $ref: '#/components/schemas/Team'
          description: Match requires exactly one team; tournament requires at least one.
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/ActivityInvitation'
      required: [kind, name, startsAt, minPlayersPerTeam, maxPlayersPerTeam, teams]
    UpdateActivityRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/ActivityKind'
        name:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          nullable: true
        location:
          type: string
        matchFormatId:
          type: string
          nullable: true
        opponentName:
          type: string
        minPlayersPerTeam:
          type: integer
          minimum: 1
        maxPlayersPerTeam:
          type: integer
          minimum: 1
        teams:
          type: array
          items:
            $ref: '#/components/schemas/Team'
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/ActivityInvitation'
    ShirtAssignment:
      type: object
      properties:
        playerId:
          type: string
          
        shirtNumber:
          type: integer
          minimum: 1
      required:
        - playerId
        - shirtNumber
    Team:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        strength:
          type: integer
          minimum: 1
          maximum: 3
          default: 2
        startTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: "14:30"
        location:
          type: string
          description: Optional location for the team (overrides event location)
        meetingTime:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: "13:45"
          description: Time when the team meets before the match
        meetingLocation:
          type: string
          description: Location where the team meets before the match
        selectedPlayers:
          type: array
          items:
            type: string
        responsiblePersonId:
          type: string
        status:
          type: string
          enum: [new, selected]
        shirtSetId:
          type: string
          nullable: true
        shirtAssignments:
          type: array
          items:
            $ref: '#/components/schemas/ShirtAssignment'
          nullable: true
        formationId:
          type: string
          nullable: true
          description: >-
            References a Formation in the same group. Only settable while the
            Team's Event has a non-null playingModeId. Fixed for the whole
            match.
        lineup:
          type: array
          items:
            $ref: '#/components/schemas/TeamLineupPeriod'
          nullable: true
          description: One entry per planned period; unlisted periods are unplanned.
      required:
        - id
        - name
        - strength
        - selectedPlayers
    Shirt:
      type: object
      properties:
        number:
          type: integer
          minimum: 1
        size:
          type: string
          enum: ['128', '140', '152', '164', 'XS', 'S', 'M', 'L', 'XL']
        isGoalkeeper:
          type: boolean
        status:
          type: string
          enum: [available, unavailable]
          default: available
      required:
        - number
        - size
        - isGoalkeeper
    ShirtSet:
      type: object
      properties:
        id:
          type: string
          
        sponsor:
          type: string
        color:
          type: string
        shirts:
          type: array
          items:
            $ref: '#/components/schemas/Shirt'
      required:
        - id
        - sponsor
        - color
        - shirts
    CreateShirtSetRequest:
      type: object
      properties:
        sponsor:
          type: string
        color:
          type: string
        shirts:
          type: array
          items:
            $ref: '#/components/schemas/Shirt'
      required:
        - sponsor
        - color
        - shirts
    UpdateShirtSetRequest:
      type: object
      properties:
        sponsor:
          type: string
        color:
          type: string
        shirts:
          type: array
          items:
            $ref: '#/components/schemas/Shirt'
      required:
        - sponsor
        - color
        - shirts
tags:
  - name: Spond Integration
    description: Request-scoped access to Spond for manual synchronization
  - name: Authentication
    description: User registration and authentication endpoints
  - name: Health
    description: API health check endpoints
  - name: Squads
    description: Operations on squads for organizing teams
  - name: Members
    description: Operations on members (players and trainers) within a squad
  - name: Evaluations
    description: Operations on player evaluations within a squad
  - name: Shirt Sets
    description: Operations on shirt sets and equipment within a squad
