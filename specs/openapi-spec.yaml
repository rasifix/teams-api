  /api/squads/{squadId}/activities/{id}/history:
    get:
      operationId: getActivityHistory
      summary: Get enriched Activity history, newest commit first
      tags: [Activities]
      security: [{ bearerAuth: [] }]
      description: Squad administrators only. Deleted Activities remain readable while their event stream exists.
      parameters:
        - $ref: '#/components/parameters/ActivitySquadId'
        - $ref: '#/components/parameters/ActivityPathId'
      responses:
        '200':
          description: One item per commit, with changes in event ordinal order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityHistoryPage' }
        '404': { description: Activity event stream not found }
  /api/squads/{squadId}/activities/{id}/details:
    patch:
      operationId: patchActivityDetails
      tags: [Activities]
      security: [{ bearerAuth: [] }]
      parameters: &activityCommandParameters
        - $ref: '#/components/parameters/ActivitySquadId'
        - $ref: '#/components/parameters/ActivityPathId'
        - $ref: '#/components/parameters/ActivityIfMatch'
        - $ref: '#/components/parameters/ActivityIdempotencyKey'
