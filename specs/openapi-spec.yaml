components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/login or /auth/register
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
    UserResponse:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - email
    Group:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        club:
          type: string
          nullable: true
        category:
          $ref: '#/components/schemas/GroupCategory'
        description:
          type: string
          nullable: true
        trainers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              email:
                type: string
                format: email
        members:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/Player'
              - $ref: '#/components/schemas/Trainer'
        periods:
          type: array
          items:
            $ref: '#/components/schemas/Period'
        matchPlanningEnabled:
          type: boolean
          default: false
          description: Opt-in flag for Playing Modes/Formations/lineup planning.
        playingModes:
          type: array
          items:
            $ref: '#/components/schemas/PlayingMode'
          description: Group-scoped only; never shared with other groups.
        formations:
          type: array
          items:
            $ref: '#/components/schemas/Formation'
          description: Group-scoped only; never shared with other groups.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
    Period:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
      required:
        - id
        - name
        - startDate
        - endDate
    CreateGroupRequest:
      type: object
      properties:
        name:
          type: string
        club:
          type: string
          nullable: true
        category:
          $ref: '#/components/schemas/GroupCategory'
        description:
          type: string
          nullable: true
        trainers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              email:
                type: string
                format: email
      required:
        - name
    UpdateGroupRequest:
      type: object
      properties:
        name:
          type: string
        club:
          type: string
          nullable: true
        category:
          $ref: '#/components/schemas/GroupCategory'
        description:
          type: string
          nullable: true
        trainers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              email:
                type: string
                format: email
        matchPlanningEnabled:
          type: boolean
          description: >-
            Toggling this does not delete existing Playing Modes, Formations,
            or Team lineup data. Requires admin or trainer role.
    GroupCategory:
      type: string
      enum: [A, B, C, D9, D7, E, F, G, FF9, FF11, FF14, FF17]
      description: Swiss Football Association (SFV) team category.
    CreatePeriodRequest:
      type: object
      properties:
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
      required:
        - name
        - startDate
        - endDate
    UpdatePeriodRequest:
      type: object
      properties:
        name:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
    PlayingMode:
      type: object
      description: >-
        Group-scoped subresource (see Group.playingModes). Never referenced
        across groups.
      properties:
        id:
          type: string
        name:
          type: string
          example: "4x20"
        numberOfPeriods:
          type: integer
          minimum: 1
          example: 4
        periodLengthMinutes:
          type: integer
          minimum: 1
          example: 20
        isDefault:
          type: boolean
          default: false
          description: Exactly one Playing Mode per group may be true.
      required:
        - id
        - name
        - numberOfPeriods
        - periodLengthMinutes
    CreatePlayingModeRequest:
      type: object
      properties:
        name:
          type: string
        numberOfPeriods:
          type: integer
          minimum: 1
        periodLengthMinutes:
          type: integer
          minimum: 1
      required:
        - name
        - numberOfPeriods
        - periodLengthMinutes
    UpdatePlayingModeRequest:
      type: object
      properties:
        name:
          type: string
        numberOfPeriods:
          type: integer
          minimum: 1
        periodLengthMinutes:
          type: integer
          minimum: 1
    PositionCode:
      type: string
      description: >-
        Language-neutral position abbreviation (same catalog as used in
        games like FIFA). Translating a code into a localized label (e.g.
        English "LB" for "left back" vs. German "LV" for "linker
        Verteidiger") is a frontend i18n concern; the backend only stores
        and validates the code.
      enum:
        - GK
        - LB
        - CB
        - RB
        - LWB
        - RWB
        - CDM
        - CM
        - CAM
        - LM
        - RM
        - LW
        - RW
        - CF
        - ST
    FormationSlot:
      type: object
      properties:
        id:
          type: string
        positionCode:
          $ref: '#/components/schemas/PositionCode'
      required:
        - id
        - positionCode
    Formation:
      type: object
      description: >-
        Group-scoped subresource (see Group.formations). Never referenced
        across groups.
      properties:
        id:
          type: string
        name:
          type: string
          example: "3-3"
        slots:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/FormationSlot'
          description: >-
            Exactly one slot must have positionCode GK; other codes may
            repeat (e.g. two CB slots), distinguished only by array order.
      required:
        - id
        - name
        - slots
    CreateFormationRequest:
      type: object
      properties:
        name:
          type: string
        slots:
          type: array
          minItems: 2
          items:
            type: object
            properties:
              positionCode:
                $ref: '#/components/schemas/PositionCode'
            required:
              - positionCode
      required:
        - name
        - slots
    UpdateFormationRequest:
      type: object
      properties:
        name:
          type: string
        slots:
          type: array
          minItems: 2
          items:
            type: object
            properties:
              id:
                type: string
              positionCode:
                $ref: '#/components/schemas/PositionCode'
            required:
              - positionCode
    LineupPositionAssignment:
      type: object
      properties:
        slotId:
          type: string
          description: Must reference a slot in the Team's selected Formation.
        playerId:
          type: string
          description: Must be one of the Team's selectedPlayers.
      required:
        - slotId
        - playerId
    TeamLineupPeriod:
      type: object
      properties:
        periodNumber:
          type: integer
          minimum: 1
          description: Must not exceed the Event's Playing Mode numberOfPeriods.
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/LineupPositionAssignment'
          description: >-
            Selected players absent here are implicitly benched for this
            period; no explicit bench list is stored.
      required:
        - periodNumber
        - assignments
    Player:
      type: object
      properties:
        id:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/GroupRole'
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date
        level:
          type: integer
          minimum: 1
          maximum: 5
        preferredShirtNumber:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [active, trial, inactive]
          default: active
        guardians:
          type: array
          items:
            $ref: '#/components/schemas/Guardian'
      required:
        - id
        - roles
        - firstName
        - lastName
        - level
    PlayerEvaluation:
      type: object
      properties:
        id:
          type: string
        playerId:
          type: string
        evaluationDate:
          type: string
          format: date
        userId:
          type: string
        score:
          type: object
          properties:
            technical:
              type: integer
              minimum: 1
              maximum: 5
            intelligence:
              type: integer
              minimum: 1
              maximum: 5
            personality:
              type: integer
              minimum: 1
              maximum: 5
            speed:
              type: integer
              minimum: 1
              maximum: 5
        comments:
          type: string
          nullable: true
      required:
        - playerId
        - evaluationDate
        - score
        - userId
    Trainer:
      type: object
      properties:
        id:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/GroupRole'
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
          nullable: true
      required:
        - id
        - roles
        - firstName
        - lastName
    Guardian:
      type: object
      properties:
        id:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/GroupRole'
        groupId:
          type: string
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
      required:
        - id
        - groupId
        - roles
    GroupRole:
      type: string
      enum: [admin, trainer, guardian, player]
    CreateGuardianRequest:
      type: object
      properties:
        guardianId:
          type: string
      required:
        - guardianId
    PlayerWithRole:
      allOf:
        - $ref: '#/components/schemas/Player'
    TrainerWithRole:
      allOf:
        - $ref: '#/components/schemas/Trainer'
    CreatePlayerRequest:
      type: object
      properties:
        role:
          type: string
          enum: [player]
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date
        level:
          type: integer
          minimum: 1
          maximum: 5
        preferredShirtNumber:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [active, trial, inactive]
          default: active
      required:
        - role
        - firstName
        - lastName
        - birthDate
        - level
    CreateTrainerRequest:
      type: object
      properties:
        role:
          type: string
          enum: [trainer]
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
      required:
        - role
        - firstName
        - lastName
    UpdatePlayerRequest:
      type: object
      properties:
        role:
          type: string
          enum: [player]
        firstName:
          type: string
        lastName:
          type: string
        birthDate:
          type: string
          format: date
        level:
          type: integer
          minimum: 1
          maximum: 5
        preferredShirtNumber:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [active, trial, inactive]
          default: active
      required:
        - role
        - firstName
        - lastName
        - birthDate
        - level
    UpdateTrainerRequest:
      type: object
      properties:
        role:
          type: string
          enum: [trainer]
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
      required:
        - role
        - firstName
        - lastName
    Invitation:
      type: object
      properties:
        id:
          type: string
          
        playerId:
          type: string
          
        status:
          type: string
          enum: [open, accepted, declined, injured, sick, unavailable]
      required:
        - id
        - playerId
        - status
    ShirtAssignment:
      type: object
      properties:
        playerId:
          type: string
          
        shirtNumber:
          type: integer
          minimum: 1
      required:
        - playerId
        - shirtNumber
    Team:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        strength:
          type: integer
          minimum: 1
          maximum: 3
          default: 2
        startTime:
          type: string
          pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
          example: "14:30"
        location:
          type: string
          description: Optional location for the team (overrides event location)
        selectedPlayers:
          type: array
          items:
            type: string
        trainerId:
          type: string
          nullable: true
        shirtSetId:
          type: string
          nullable: true
        shirtAssignments:
          type: array
          items:
            $ref: '#/components/schemas/ShirtAssignment'
          nullable: true
        formationId:
          type: string
          nullable: true
          description: >-
            References a Formation in the same group. Only settable while the
            Team's Event has a non-null playingModeId. Fixed for the whole
            match.
        lineup:
          type: array
          items:
            $ref: '#/components/schemas/TeamLineupPeriod'
          nullable: true
          description: One entry per planned period; unlisted periods are unplanned.
      required:
        - id
        - name
        - strength
        - startTime
        - selectedPlayers
    Event:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        date:
          type: string
          format: date
        maxPlayersPerTeam:
          type: integer
          minimum: 1
        minPlayersPerTeam:
          type: integer
          minimum: 1
        location:
          type: string
        playingModeId:
          type: string
          nullable: true
          description: >-
            References a Playing Mode in the same group. Only usable when the
            group has matchPlanningEnabled true. Always optional/resettable.
        teams:
          type: array
          items:
            $ref: '#/components/schemas/Team'
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
      required:
        - id
        - name
        - date
        - minPlayersPerTeam
        - maxPlayersPerTeam
        - teams
        - invitations
    CreateEventRequest:
      type: object
      properties:
        name:
          type: string
        date:
          type: string
          format: date
        maxPlayersPerTeam:
          type: integer
          minimum: 1
        minPlayersPerTeam:
          type: integer
          minimum: 1
          default: 1
        location:
          type: string
        playingModeId:
          type: string
          nullable: true
          description: >-
            Omit to auto-assign the group's default Playing Mode (if any);
            pass null explicitly to opt out at creation.
        teams:
          type: array
          items:
            $ref: '#/components/schemas/Team'
      required:
        - name
        - date
        - maxPlayersPerTeam
        - minPlayersPerTeam
    UpdateEventRequest:
      type: object
      properties:
        name:
          type: string
        date:
          type: string
          format: date
        maxPlayersPerTeam:
          type: integer
          minimum: 1
        location:
          type: string
        playingModeId:
          type: string
          nullable: true
          description: >-
            Set to a Playing Mode id from the same group, or null to reset to
            none. Rejected with 400 if the group has matchPlanningEnabled
            false.
        teams:
          type: array
          items:
            $ref: '#/components/schemas/Team'
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
    Shirt:
      type: object
      properties:
        number:
          type: integer
          minimum: 1
        size:
          type: string
          enum: ['128', '140', '152', '164', 'XS', 'S', 'M', 'L', 'XL']
        isGoalkeeper:
          type: boolean
        status:
          type: string
          enum: [available, unavailable]
          default: available
      required:
        - number
        - size
        - isGoalkeeper
    ShirtSet:
      type: object
      properties:
        id:
          type: string
          
        sponsor:
          type: string
        color:
          type: string
        shirts:
          type: array
          items:
            $ref: '#/components/schemas/Shirt'
      required:
        - id
        - sponsor
        - color
        - shirts
    CreateShirtSetRequest:
      type: object
      properties:
        sponsor:
          type: string
        color:
          type: string
        shirts:
          type: array
          items:
            $ref: '#/components/schemas/Shirt'
      required:
        - sponsor
        - color
        - shirts
    UpdateShirtSetRequest:
      type: object
      properties:
        sponsor:
          type: string
        color:
          type: string
        shirts:
          type: array
          items:
            $ref: '#/components/schemas/Shirt'
      required:
        - sponsor
        - color
        - shirts
tags:
  - name: Authentication
