    post:
      operationId: runActivityEventMigration
      summary: Migrate Activity projections to event streams
      description: Internal migration endpoint. Activity writes must be paused before calling it.
      tags: [Internal]
      security: []
      parameters:
        - name: X-Migration-Token
          in: header
          required: true
          schema: { type: string }
        - name: X-Confirm-Activity-Writes-Paused
          in: header
          required: true
          schema: { type: string, enum: ['yes'] }
      responses:
        '200':
          description: Migration completed with no mismatches
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityEventMigrationResult' }
        '400': { description: Activity writes pause was not confirmed }
        '401': { description: Invalid migration token }
        '409': { description: Migration in progress or mismatches detected }
        '500': { description: Migration failed }
        '503': { description: Migration endpoint is not configured }
