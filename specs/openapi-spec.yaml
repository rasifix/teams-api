        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityDetailsPatch' }
      responses: &activityCommandResponses
        '200':
          description: Complete updated Activity
          headers:
            ETag: { $ref: '#/components/headers/ActivityETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        '400': { description: Invalid command }
        '404': { description: Activity or team not found }
        '409': { description: Revision or idempotency conflict }
  /api/squads/{squadId}/activities/{id}/teams/{teamId}/details:
