openapi: 3.0.3
info:
  title: Teams API
  description: API for managing soccer teams, players, trainers, events, and equipment
  version: 1.0.0
  contact:
    name: Teams API Support
    email: support@teams-api.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://api.teams.com
    description: Production server
# Authentication is specified per operation.
security: []
paths:
  /api/birthday-calendars/{token}.ics:
    get:
      operationId: getBirthdayCalendarFeed
      summary: Subscribe to a squad birthday calendar
      description: >-
        Public bearer-link calendar feed containing annually recurring, all-day
        birthdays for active players. The feed includes player names and birthday
        month/day, but does not expose birth years or ages. Revoking the squad's
        subscription invalidates the token.
      tags: [Squads]
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: iCalendar birthday feed
          content:
            text/calendar:
              schema: { type: string }
        '404':
          description: Calendar not found or revoked
          content:
            text/html:
              schema: { type: string }
  /api/squads/{squadId}/birthday-calendar:
    get:
      operationId: getBirthdayCalendarSubscription
      summary: Get the squad birthday calendar subscription
      tags: [Squads]
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current subscription URL, or null when none exists
          content:
            application/json:
              schema:
                type: object
                required: [subscriptionUrl]
                properties:
                  subscriptionUrl: { type: string, format: uri, nullable: true }
        '403': { description: Admin or trainer access required }
    post:
      operationId: createBirthdayCalendarSubscription
      summary: Create the squad birthday calendar subscription
      description: Returns the existing link when a subscription is already active.
      tags: [Squads]
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Existing subscription URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BirthdayCalendarSubscription' }
        '201':
          description: Subscription URL created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BirthdayCalendarSubscription' }
        '403': { description: Admin or trainer access required }
    delete:
      operationId: revokeBirthdayCalendarSubscription
      summary: Revoke the squad birthday calendar subscription
      tags: [Squads]
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Subscription revoked }
        '403': { description: Admin or trainer access required }
  /api/squads/{squadId}/spond/import:
    post:
      operationId: importSpondSnapshot
      summary: Apply a reviewed Spond snapshot
      description: Applies selected links and creates or updates records using stable Spond identifiers.
      tags:
        - Spond Integration
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpondImportRequest'
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpondImportResult'
        '400':
          description: Invalid import payload
        '401':
          description: Not authenticated
        '403':
          description: Admin or trainer permission required
        '409':
          description: Conflicting Spond link
  /api/integrations/spond/groups:
    post:
      operationId: listSpondGroups
      summary: List groups available to the supplied Spond account
      description: Credentials and the resulting Spond access token are used only for this request and are not persisted.
      tags:
        - Spond Integration
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpondCredentials'
      responses:
        '200':
          description: Spond groups accessible to the account
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpondGroupSummary'
        '400':
          description: Credentials are missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: App or Spond authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Spond returned an invalid response or could not be reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/integrations/spond/snapshot:
    post:
      operationId: getSpondSnapshot
      summary: Read a normalized Spond group snapshot
      description: Credentials and the resulting Spond access token are used only for this request and are not persisted.
      tags:
        - Spond Integration
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpondSnapshotRequest'
      responses:
        '200':
          description: Normalized members and events for the requested group and time range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpondSnapshot'
        '400':
          description: Credentials or snapshot scope are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: App or Spond authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Spond returned an invalid response or could not be reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/sfv-categories:
    get:
      operationId: getSfvCategories
      summary: Get the SFV category catalog
      description: >-
        Read-only catalog data provided for Phase 2. The response identifies
        the catalog date and distinguishes categories that play tournaments
        from categories with a default match format.
      tags:
        - Squads
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Category catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SfvCategoryCatalog'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/squads/{squadId}/activities:
    get:
      operationId: getGroupActivities
      summary: List activities in a squad
      tags:
        - Activities
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Activities in the group
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activity'
    post:
      operationId: createGroupActivity
      summary: Create a match or tournament activity
      description: Training and social activities are not creatable in this phase.
      tags:
        - Activities
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/ActivityIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActivityRequest'
      responses:
        '201':
          description: Activity created
          headers:
            ETag: { $ref: '#/components/headers/ActivityETag' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          description: Activity invariants were not satisfied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/squads/{squadId}/activity-events:
    get:
      operationId: getSquadActivityAuditEvents
      summary: List Activity audit events for a squad
      tags:
        - Activities
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
        - name: activityId
          in: query
          schema:
            type: string
        - name: eventType
          in: query
          schema:
            $ref: '#/components/schemas/ActivityEventType'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Immutable Activity event commits in descending record order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityAuditEventPage'
        '400':
          description: Invalid filter or cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Only Squad administrators may access the audit stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/squads/{squadId}/activities/{id}:
    get:
      operationId: getGroupActivity
      summary: Get an activity
      tags:
        - Activities
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Activity
          headers:
            ETag:
              $ref: '#/components/headers/ActivityETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '404':
          description: Activity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      operationId: updateGroupActivity
      deprecated: true
      summary: Update an activity
      tags:
        - Activities
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/ActivityIfMatch'
        - $ref: '#/components/parameters/ActivityIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActivityRequest'
      responses:
        '200':
          description: Activity updated
          headers:
            ETag:
              $ref: '#/components/headers/ActivityETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          description: Activity invariants were not satisfied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Activity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Activity revision or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteGroupActivity
      summary: Delete an activity
      tags:
        - Activities
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/ActivityIfMatch'
        - $ref: '#/components/parameters/ActivityIdempotencyKey'
      responses:
        '204':
          description: Activity deleted
        '404':
          description: Activity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Activity revision or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/squads/{squadId}/activities/{id}/status:
    put:
      operationId: updateActivityStatus
      summary: Cancel or restore an Activity
      description: Spond-linked Activities receive their status from Spond and cannot be changed here.
      tags: [Activities]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ActivitySquadId'
        - $ref: '#/components/parameters/ActivityPathId'
        - $ref: '#/components/parameters/ActivityIfMatch'
        - $ref: '#/components/parameters/ActivityIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/ActivityStatus' }
      responses:
        '200':
          description: Complete updated Activity
          headers:
            ETag: { $ref: '#/components/headers/ActivityETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        '400': { description: Invalid status or Spond-linked Activity }
        '404': { description: Activity not found }
        '409': { description: Revision or idempotency conflict }
  /api/squads/{squadId}/activities/{id}/invitations:
    put:
      operationId: updateGroupActivityInvitations
      deprecated: true
      summary: Set the complete activity invitation list
      tags:
        - Activities
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitations]
              properties:
                invitations:
                  type: array
                  items:
                    $ref: '#/components/schemas/ActivityInvitation'
      responses:
        '200':
          description: Updated activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          description: Invalid invitation update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: addActivityInvitations
      tags: [Activities]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ActivitySquadId'
        - $ref: '#/components/parameters/ActivityPathId'
        - $ref: '#/components/parameters/ActivityIfMatch'
        - $ref: '#/components/parameters/ActivityIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddActivityInvitationsCommand' }
      responses:
        '200':
          description: Complete updated Activity
          headers:
            ETag: { $ref: '#/components/headers/ActivityETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        '400': { description: Invalid command }
        '404': { description: Activity or team not found }
        '409': { description: Revision or idempotency conflict }
  /api/squads/{squadId}/activities/{id}/invitations/{playerId}:
    put:
      operationId: updateGroupActivityInvitation
      summary: Respond to an activity invitation
      tags:
        - Activities
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: playerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityInvitationUpdate'
      responses:
        '200':
          description: Updated activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '403':
          description: Guardian may only respond for their own child
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: removeActivityInvitation
      description: Removing an invitation that would change selection is allowed only before the Activity starts and before attendance is recorded.
      tags: [Activities]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ActivitySquadId'
        - $ref: '#/components/parameters/ActivityPathId'
        - { name: playerId, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/ActivityIfMatch'
        - $ref: '#/components/parameters/ActivityIdempotencyKey'
      responses:
        '200':
          description: Complete updated Activity
          headers:
            ETag: { $ref: '#/components/headers/ActivityETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        '400': { description: Invalid command }
        '404': { description: Activity or team not found }
        '409': { description: Revision or idempotency conflict }
  /api/squads/{squadId}/activities/{id}/selection:
    put:
      operationId: updateGroupActivitySelection
      deprecated: true
      summary: Update activity team selections
      tags:
        - Activities
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teams]
              properties:
                teams:
                  type: array
                  items:
                    $ref: '#/components/schemas/Team'
      responses:
        '200':
          description: Updated activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          description: Selection invariants were not satisfied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/squads/{squadId}/activities/{id}/selection/sent:
    put:
      operationId: markGroupActivitySelectionSent
      summary: Mark activity selection as sent
      tags:
        - Activities
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Selection sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '400':
          description: Every team needs at least one responsible person
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/squads/{squadId}/activities/{id}/teams:
    put:
      operationId: updateGroupActivityTeams
      deprecated: true
      summary: Replace teams for an activity
      tags:
        - Activities
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teams]
              properties:
                teams:
                  type: array
                  items:
                    $ref: '#/components/schemas/Team'
      responses:
        '200':
          description: Updated activity teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Team'
    post:
      operationId: addActivityTeam
      tags: [Activities]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ActivitySquadId'
        - $ref: '#/components/parameters/ActivityPathId'
        - $ref: '#/components/parameters/ActivityIfMatch'
        - $ref: '#/components/parameters/ActivityIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddActivityTeam' }
      responses:
        '200':
          description: Complete updated Activity
          headers:
            ETag: { $ref: '#/components/headers/ActivityETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        '400': { description: Invalid command }
        '404': { description: Activity or team not found }
        '409': { description: Revision or idempotency conflict }
  /api/squads/{squadId}/activities/{id}/attendance:
    put:
      operationId: updateGroupActivityAttendance
      deprecated: true
      summary: Bulk upsert activity attendance
      description: Admins and trainers may record attendance only after the activity starts. Attendance is independent of invitations and selection.
      tags: [Activities]
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attendance]
              properties:
                attendance:
                  type: array
                  items:
                    $ref: '#/components/schemas/ActivityAttendance'
      responses:
        '200':
          description: Updated attendance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActivityAttendance'
        '400':
          description: Activity has not started or attendance is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: patchActivityAttendance
      description: Attendance can be recorded only after the Activity starts, for selected players.
      tags: [Activities]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ActivitySquadId'
        - $ref: '#/components/parameters/ActivityPathId'
        - $ref: '#/components/parameters/ActivityIfMatch'
        - $ref: '#/components/parameters/ActivityIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivityAttendanceChangesCommand' }
      responses:
        '200':
          description: Complete updated Activity
          headers:
            ETag: { $ref: '#/components/headers/ActivityETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        '400': { description: Invalid command }
        '404': { description: Activity or team not found }
        '409': { description: Revision or idempotency conflict }
  /api/squads/{squadId}/match-formats:
    get:
      operationId: getSquadMatchFormats
      summary: Get match formats for a squad
      description: Compatibility alias of the squad's playing-modes collection.
      tags:
        - Squads
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved match formats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlayingMode'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to access this squad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createSquadMatchFormat
      summary: Create a match format for a squad
      description: Compatibility alias of creating a playing mode.
      tags:
        - Squads
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlayingModeRequest'
      responses:
        '201':
          description: Match format created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayingMode'
        '400':
          description: Invalid match format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to modify this squad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/squads/{squadId}/match-formats/{matchFormatId}:
    put:
      operationId: updateSquadMatchFormat
      summary: Update a squad match format
      tags:
        - Squads
      security:
        - bearerAuth: []
      parameters:
        - name: squadId
          in: path
          required: true
          schema:
            type: string
        - name: matchFormatId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlayingModeRequest'
      responses:
        '200':
          description: Match format updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayingMode'
        '403':
          description: Not authorized to modify this squad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: deleteSquadMatchFormat
